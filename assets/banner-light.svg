<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Aniket Kumar, AI engineer</title>
  <desc id="d">Banner: Aniket Kumar, AI engineer building LLM systems that answer from real data and evaluating them until they hold up. Beside it, an evaluation run where four reliability checks pass.</desc>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.9)"/><stop offset="0.4" stop-color="rgba(255,255,255,0.9)" stop-opacity="0"/>
      <stop offset="0.75" stop-color="rgba(255,255,255,0.9)" stop-opacity="0"/><stop offset="1" stop-color="rgba(255,255,255,0.9)" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
      .row { opacity: 0; animation: rise .6s cubic-bezier(.23,1,.32,1) forwards; }
      .done { opacity: 0; animation: rise .6s cubic-bezier(.23,1,.32,1) 2.90s forwards; }
      .bar { transform-origin: 812px 290px; transform: scaleX(0); animation: grow 2.00s linear .9s forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes grow { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .row, .done { animation: none; opacity: 1; }
        .bar { animation: none; transform: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="#f6f6f4"/>
    <g filter="url(#blur)">
      <circle cx="1180" cy="30" r="170" fill="#c2410c" opacity="0.22"/>
      <circle cx="120" cy="300" r="170" fill="#3f7f73" opacity="0.22"/>
      <circle cx="760" cy="340" r="140" fill="#d9a441" opacity="0.20"/>
    </g>

    <!-- identity -->
    <g class="rise" style="animation-delay:.05s">
      <text x="64" y="92" class="mono" font-size="14" letter-spacing="1.5" fill="#5f6461">AI ENGINEER · NEW DELHI</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text x="62" y="156" class="sans" font-size="64" font-weight="700" letter-spacing="-2.2" fill="#121413">Aniket Kumar</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text x="64" y="198" class="sans" font-size="20" fill="#3d413f">I build LLM systems that answer from real data,</text>
      <text x="64" y="226" class="sans" font-size="20" fill="#3d413f">then evaluate them until they <tspan fill="#c2410c" font-weight="600">hold up</tspan>.</text>
    </g>
    <g class="rise mono" style="animation-delay:.45s" font-size="13" fill="#3d413f">
      <rect x="64" y="252" width="62" height="28" rx="14" fill="rgba(20,20,18,0.05)"/><text x="95" y="271" text-anchor="middle">RAG</text>
      <rect x="134" y="252" width="80" height="28" rx="14" fill="rgba(20,20,18,0.05)"/><text x="174" y="271" text-anchor="middle">Agents</text>
      <rect x="222" y="252" width="132" height="28" rx="14" fill="rgba(20,20,18,0.05)"/><text x="288" y="271" text-anchor="middle">LLM evaluation</text>
      <rect x="362" y="252" width="98" height="28" rx="14" fill="rgba(20,20,18,0.05)"/><text x="411" y="271" text-anchor="middle">Backends</text>
    </g>

    <!-- glass eval window -->
    <g class="rise" style="animation-delay:.35s">
      <rect x="784" y="58" width="416" height="250" rx="18" fill="rgba(255,255,255,0.62)"/>
      <rect x="784.5" y="58.5" width="415" height="249" rx="17.5" fill="none" stroke="url(#rim)"/>
      <circle cx="808" cy="82" r="5" fill="#ff5f57"/><circle cx="826" cy="82" r="5" fill="#febc2e"/><circle cx="844" cy="82" r="5" fill="#28c840"/>
      <text x="866" y="86" class="mono" font-size="12" fill="#5f6461">eval · grounded-answers</text>
      <line x1="784" y1="102" x2="1200" y2="102" stroke="rgba(20,20,18,0.08)"/>
      <text x="808" y="128" class="mono" font-size="12" fill="#5f6461">check</text>
      <text x="1176" y="128" class="mono" font-size="12" fill="#5f6461" text-anchor="end">result</text>
    </g>
    
    <g class="row" style="animation-delay:0.90s">
      <circle cx="822" cy="148" r="6" fill="#1f7a4d"/>
      <path d="M819 148 l2.2 2.2 l4.2 -4.4" fill="none" stroke="#f6f6f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="840" y="152" class="mono" font-size="13" fill="#3d413f">answer cites the retrieved source</text>
      <rect x="1118" y="137" width="46" height="20" rx="10" fill="rgba(31,122,77,0.10)"/>
      <text x="1141" y="151" class="mono" font-size="11" font-weight="600" fill="#1f7a4d" text-anchor="middle">pass</text>
    </g>
    <g class="row" style="animation-delay:1.35s">
      <circle cx="822" cy="182" r="6" fill="#1f7a4d"/>
      <path d="M819 182 l2.2 2.2 l4.2 -4.4" fill="none" stroke="#f6f6f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="840" y="186" class="mono" font-size="13" fill="#3d413f">refuses when context is missing</text>
      <rect x="1118" y="171" width="46" height="20" rx="10" fill="rgba(31,122,77,0.10)"/>
      <text x="1141" y="185" class="mono" font-size="11" font-weight="600" fill="#1f7a4d" text-anchor="middle">pass</text>
    </g>
    <g class="row" style="animation-delay:1.80s">
      <circle cx="822" cy="216" r="6" fill="#1f7a4d"/>
      <path d="M819 216 l2.2 2.2 l4.2 -4.4" fill="none" stroke="#f6f6f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="840" y="220" class="mono" font-size="13" fill="#3d413f">no invented numbers or names</text>
      <rect x="1118" y="205" width="46" height="20" rx="10" fill="rgba(31,122,77,0.10)"/>
      <text x="1141" y="219" class="mono" font-size="11" font-weight="600" fill="#1f7a4d" text-anchor="middle">pass</text>
    </g>
    <g class="row" style="animation-delay:2.25s">
      <circle cx="822" cy="250" r="6" fill="#1f7a4d"/>
      <path d="M819 250 l2.2 2.2 l4.2 -4.4" fill="none" stroke="#f6f6f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="840" y="254" class="mono" font-size="13" fill="#3d413f">tool calls stay inside the graph</text>
      <rect x="1118" y="239" width="46" height="20" rx="10" fill="rgba(31,122,77,0.10)"/>
      <text x="1141" y="253" class="mono" font-size="11" font-weight="600" fill="#1f7a4d" text-anchor="middle">pass</text>
    </g>
    <rect x="812" y="286" width="360" height="4" rx="2" fill="rgba(20,20,18,0.08)"/>
    <rect class="bar" x="812" y="286" width="360" height="4" rx="2" fill="#c2410c"/>
    <g class="done"><text x="1172" y="276" class="mono" font-size="12" font-weight="600" fill="#1f7a4d" text-anchor="end">4 / 4 checks passed</text></g>
  </g>
</svg>
